<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>First Snow | Poetry</title><link rel=stylesheet href=/poetry-blog/css/style.css></head><body><main class=container><article class=poem><h1>First Snow</h1><div class=meta><time datetime=2026-01-01>January 1, 2026</time></div><div class=content><p>A hush of white across the field,
each breath a small, bright world revealed.</p><p>The lane remembers footsteps slow,
light maps the places we used to know.</p></div></article></main><footer class=footer><p>D. Buckingham</p></footer></body></html>
